[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context.engine"
version = "0.2.0"
description = "Pack the best, least redundant context into a fixed token budget and explain every drop: greedy, density and exact knapsack strategies, near-duplicate handling, quotas, truncation, ordering. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[project.scripts]
context-engine = "context_engine.cli:main"

[tool.setuptools.package-data]
context_engine = ["py.typed"]

[tool.setuptools.packages.find]
include = ["context_engine*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["context_engine"]
